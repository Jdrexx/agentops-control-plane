[project]
name = "agentops-control-plane"
version = "0.1.0"
description = "Local-first observability, approvals, replay, and evaluation for AI workflows."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "cryptography>=50,<51",
  "fastapi>=0.141,<0.142",
  "jsonschema>=4,<5",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]
