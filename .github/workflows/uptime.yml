name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production dependencies
        run: |
          base_url="https://agentops-control-plane-production.up.railway.app"

          health="$(curl --fail --silent --show-error --retry 3 \
            "$base_url/api/health")"
          echo "$health" | jq -e \
            '.status == "ok" and (.version | length > 0)'

          ready="$(curl --fail --silent --show-error --retry 3 \
            "$base_url/api/ready")"
          echo "$ready" | jq -e \
            '.status == "ready" and .database == "ok" and .queue == "redis"'

          session_headers="$(curl --silent --show-error --dump-header - \
            --output /dev/null "$base_url/api/session")"
          echo "$session_headers" | grep -Eiq '^HTTP/[0-9.]+ 401'
          echo "$session_headers" | grep -Eiq '^cache-control: no-store'
          echo "$session_headers" | grep -Eiq '^x-content-type-options: nosniff'
