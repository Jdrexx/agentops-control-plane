name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint Python
        run: uv run ruff check .
      - name: Test with coverage
        run: uv run pytest --cov=src.agentops --cov-report=term-missing --cov-fail-under=85
      - name: Validate dashboard JavaScript
        run: node --check src/agentops/static/app.js
      - name: Build production container
        run: docker build -t agentops-control-plane:ci .
      - name: Smoke-test Compose demo
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color agentops; docker compose down -v' EXIT
          docker compose up -d --build agentops
          python3 scripts/demo_smoke.py
